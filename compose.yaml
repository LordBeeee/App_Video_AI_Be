services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: video_ai
      POSTGRES_PASSWORD: change_me_local
      POSTGRES_DB: video_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_ai -d video_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
